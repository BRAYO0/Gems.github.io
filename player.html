<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream11 - Player</title>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script type="text/javascript"
        src="//cdn.jsdelivr.net/gh/ewwink/clappr-quality-selector-plugin@latest/quality-selector.js"></script>
    <link rel="icon" type="image/png" href="assets/images/app_icon.png">
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@400&display=swap" rel="stylesheet">
    <script>
        // Immediate URL rewrite for player page
        (function () {
            const storedMatch = sessionStorage.getItem('active_match');
            if (storedMatch && window.location.protocol !== 'file:') {
                try {
                    const data = JSON.parse(storedMatch);
                    const matchTitle = data.title || 'Match';
                    const urlType = data.type || 'match';
                    const slug = matchTitle.replace(/\s+/g, '-');
                    history.replaceState(null, '', `${urlType}/${slug}`);
                } catch (e) {
                    console.error("Failed to parse stored match:", e);
                }
            }
        })();
    </script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Chillax', sans-serif;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .stream-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stream-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .stream-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .stream-btn.active {
            background: #00ff87;
            color: black;
            border-color: #00ff87;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .back-btn {
                padding: 6px 10px;
                font-size: 13px;
            }

            .stream-switcher {
                top: 60px;
                left: 20px;
                right: auto;
                flex-wrap: wrap;
                max-width: 200px;
            }

            .stream-btn {
                padding: 4px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html"
        onclick="if(document.referrer) { event.preventDefault(); window.history.back(); } else { window.location.href='index.html'; }"
        class="back-btn">← Back</a>

    <div id="switcher" class="stream-switcher" style="display: none;"></div>

    <div id="player"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const urlParam = params.get('url');
            const streamsParam = params.get('streams');
            const watchParam = params.get('watch');

            let streams = [];
            let player = null;
            let matchTitle = "Stream11 Player";
            let returnPath = "index.html";

            // 1. Try reading from sessionStorage (Priority - Obfuscated)
            const storedMatch = sessionStorage.getItem('active_match');
            if (storedMatch) {
                try {
                    const data = JSON.parse(storedMatch);
                    streams = data.streams || [];
                    matchTitle = data.title || matchTitle;
                    returnPath = data.returnTo || returnPath;

                    // Update Title
                    document.title = `Stream11 - Watching ${matchTitle}`;

                } catch (e) {
                    console.error("Failed to parse stored match:", e);
                }
            }

            // Update Back Button
            const backBtn = document.querySelector('.back-btn');
            if (backBtn) {
                backBtn.href = returnPath;
                // If we are in a 'Pretty URL' subfolder, we need to adjust the relative link 
                // OR just use window.location.href = returnPath
                backBtn.onclick = (e) => {
                    e.preventDefault();
                    window.location.href = returnPath;
                };
            }

            // 2. Fallback to URL parameters (Legacy/Direct links)
            if (streams.length === 0) {
                if (streamsParam) {
                    try {
                        streams = JSON.parse(streamsParam);
                    } catch (e) {
                        console.error("Failed to parse streams param:", e);
                    }
                }
                if (streams.length === 0 && urlParam) {
                    streams.push(urlParam);
                }
            }

            if (streams.length === 0) {
                document.body.innerHTML = '<div style="color:white;text-align:center;padding-top:20%;">No stream provided. <br><br><a href="index.html" style="color:#00ff87">Return Home</a></div>';
                return;
            }

            // Setup Switcher
            const switcher = document.getElementById('switcher');
            if (streams.length > 1) {
                switcher.style.display = 'flex';
                streams.forEach((s, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'stream-btn';
                    btn.textContent = `Stream ${index + 1}`;
                    btn.onclick = () => loadStream(index);
                    switcher.appendChild(btn);
                });
            }

            // Parse URL and Headers
            function parseStreamData(rawUrl) {
                // Handle object format (from new API)
                if (typeof rawUrl === 'object' && rawUrl.url) {
                    return { videoUrl: rawUrl.url, customHeaders: rawUrl.headers || {} };
                }

                let videoUrl = rawUrl;
                let customHeaders = {};

                // Handle pipe separator (Legacy/Highlights)
                if (typeof rawUrl === 'string' && rawUrl.includes('|')) {
                    const parts = rawUrl.split('|');
                    videoUrl = parts[0];
                    const headerPart = parts[1];
                    if (headerPart) {
                        const firstEq = headerPart.indexOf('=');
                        if (firstEq > -1) {
                            const key = headerPart.substring(0, firstEq);
                            const val = headerPart.substring(firstEq + 1);
                            customHeaders[key] = val;
                        }
                    }
                }
                return { videoUrl, customHeaders };
            }

            function loadStream(index) {
                // Update UI
                if (streams.length > 1) {
                    const buttons = switcher.querySelectorAll('.stream-btn');
                    buttons.forEach((b, i) => {
                        b.classList.toggle('active', i === index);
                    });
                }

                // Destroy existing player
                if (player) {
                    player.destroy();
                    player = null;
                }

                const rawUrl = streams[index];
                const { videoUrl, customHeaders } = parseStreamData(rawUrl);

                console.log(`Loading Stream ${index + 1}:`, videoUrl);
                console.log("Headers:", customHeaders);

                // Detect mobile device
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

                player = new Clappr.Player({
                    source: videoUrl,
                    parentId: "#player",
                    width: '100%',
                    height: '100%',
                    autoPlay: true,
                    plugins: [QualitySelector],
                    qualitySelectorConfig: {
                        title: 'Quality',
                        labelCallback: function (playbackLevel, customLabel) {
                            return playbackLevel.level.height + 'p';
                        }
                    },
                    // Disable click-to-play on mobile
                    clickToPlay: !isMobile,
                    mediaControl: {
                        seekbar: "#00ff87",
                        buttons: "#ffffff"
                    },
                    playback: {
                        hlsjsConfig: {
                            xhrSetup: function (xhr, url) {
                                for (const [key, value] of Object.entries(customHeaders)) {
                                    if (value !== null && value !== undefined) {
                                        xhr.setRequestHeader(key, value);
                                    }
                                }
                            }
                        }
                    }
                });

                // Force landscape orientation on mobile fullscreen
                if (isMobile) {
                    player.on(Clappr.Events.PLAYER_FULLSCREEN, function () {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(err => {
                                console.log('Orientation lock failed:', err);
                            });
                        }
                    });

                    player.on(Clappr.Events.PLAYER_EXIT_FULLSCREEN, function () {
                        if (screen.orientation && screen.orientation.unlock) {
                            screen.orientation.unlock();
                        }
                    });
                }
            }

            // Start with first stream
            loadStream(0);
        });
    </script>
</body>

</html>
