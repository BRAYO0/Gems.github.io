<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream11 - Pro Live TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #ffffff;
      margin: 0;
      overflow-x: hidden;
    }

    /* Neon UI Elements */
    .neon-text {
      text-shadow: 0 0 10px rgba(0, 255, 135, 0.8), 0 0 20px rgba(0, 255, 135, 0.4);
    }

    .neon-border {
      border: 1px solid rgba(0, 255, 135, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.1);
    }

    .glow-card {
      background: rgba(26, 31, 58, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    /* Channel Button Styling */
    .channel-btn {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .channel-btn:hover {
      background: rgba(0, 255, 135, 0.1);
      border-color: rgba(0, 255, 135, 0.4);
    }

    .channel-btn.active {
      background: linear-gradient(90deg, rgba(0, 255, 135, 0.2) 0%, transparent 100%);
      border-left: 4px solid #00ff87;
      color: #00ff87;
    }

    /* Player Container */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 255, 135, 0.3); border-radius: 10px; }

    .btn-primary {
      background: linear-gradient(135deg, #00ff87 0%, #00d66f 100%);
      color: #0a0e27;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="h-full">

  <header class="sticky top-0 z-50 backdrop-blur-lg border-b border-white/10 bg-[#0a0e27]/80">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-green-500 rounded flex items-center justify-center shadow-[0_0_15px_rgba(0,255,135,0.5)]">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0e27" stroke-width="3"><path d="M2 7l10-5 10 5-10 5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h1 class="text-xl font-bold tracking-tighter neon-text">STREAM11 <span class="text-white font-light text-sm hidden sm:inline ml-2">| LIVE TV</span></h1>
      </div>
      <div class="flex gap-4">
        <button class="text-sm font-medium hover:text-green-400 hidden md:block">Schedule</button>
        <button class="btn-primary text-sm">Upgrade to Pro</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-12">
      
      <div class="lg:col-span-1 order-2 lg:order-1">
        <div class="glow-card rounded-xl p-4 h-full">
          <h3 class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-4 px-2">Live Channels</h3>
          <div id="channelList">
            <button class="channel-btn active" onclick="playChannel('news', this)">
              <span class="text-lg">🌍</span>
              <div>
                <p class="font-semibold text-sm">Global News</p>
                <p class="text-[10px] text-gray-400">24/7 Live Coverage</p>
              </div>
            </button>
            <button class="channel-btn" onclick="playChannel('sports', this)">
              <span class="text-lg">⚽</span>
              <div>
                <p class="font-semibold text-sm">Sports Network</p>
                <p class="text-[10px] text-gray-400">Highlights & Live Events</p>
              </div>
            </button>
            <button class="channel-btn" onclick="playChannel('music', this)">
              <span class="text-lg">🎵</span>
              <div>
                <p class="font-semibold text-sm">Lofi Beats</p>
                <p class="text-[10px] text-gray-400">Chill Study Music</p>
              </div>
            </button>
            <button class="channel-btn" onclick="playChannel('gaming', this)">
              <span class="text-lg">🎮</span>
              <div>
                <p class="font-semibold text-sm">Riot Games</p>
                <p class="text-[10px] text-gray-400">Official eSports</p>
              </div>
            </button>
            <button class="channel-btn" onclick="playChannel('nature', this)">
              <span class="text-lg">🦅</span>
              <div>
                <p class="font-semibold text-sm">Nature Cam</p>
                <p class="text-[10px] text-gray-400">Wilderness Stream</p>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-3 order-1 lg:order-2">
        <div class="video-container neon-border">
          <iframe id="tvPlayer" 
                  src="https://www.youtube.com/embed/21X5lGlDOfg?autoplay=1&mute=1" 
                  allow="autoplay; fullscreen" 
                  allowfullscreen>
          </iframe>
        </div>
        <div class="mt-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div>
            <h2 id="currentChannelTitle" class="text-2xl font-bold">Global News</h2>
            <p class="text-gray-400 text-sm flex items-center gap-2">
              <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> 
              Live in HD Quality • 42k viewers
            </p>
          </div>
          <div class="flex gap-2">
            <button class="px-4 py-2 bg-white/10 rounded-lg hover:bg-white/20 transition text-sm">Share</button>
            <button class="px-4 py-2 bg-white/10 rounded-lg hover:bg-white/20 transition text-sm">Report</button>
          </div>
        </div>
      </div>

    </div>

    <section class="border-t border-white/10 pt-10">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <span class="w-1 h-6 bg-green-500 rounded-full"></span> Live Football Scores
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glow-card p-5 rounded-xl border-l-4 border-green-500">
          <div class="flex justify-between text-xs text-gray-400 mb-3"><span>Premier League</span><span class="text-red-500 font-bold">72'</span></div>
          <div class="flex justify-between items-center">
            <span class="font-medium">Man City</span>
            <span class="text-2xl font-bold neon-text">3</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-medium">Arsenal</span>
            <span class="text-2xl font-bold neon-text">1</span>
          </div>
        </div>
        <div class="glow-card p-5 rounded-xl border-l-4 border-gray-600">
          <div class="flex justify-between text-xs text-gray-400 mb-3"><span>La Liga</span><span>Upcoming</span></div>
          <div class="flex justify-between items-center">
            <span class="font-medium text-gray-300">Real Madrid</span>
            <span class="text-2xl font-bold text-gray-500">0</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-medium text-gray-300">Barcelona</span>
            <span class="text-2xl font-bold text-gray-500">0</span>
          </div>
        </div>
        <div class="glow-card p-5 rounded-xl border-l-4 border-green-500">
          <div class="flex justify-between text-xs text-gray-400 mb-3"><span>Serie A</span><span class="text-red-500 font-bold">12'</span></div>
          <div class="flex justify-between items-center">
            <span class="font-medium">Juventus</span>
            <span class="text-2xl font-bold neon-text">0</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-medium">AC Milan</span>
            <span class="text-2xl font-bold neon-text">0</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function playChannel(channel, element) {
      const player = document.getElementById("tvPlayer");
      const title = document.getElementById("currentChannelTitle");
      
      const channels = {
        news: {
          url: "https://www.youtube.com/embed/21X5lGlDOfg",
          name: "Global News"
        },
        sports: {
          url: "https://www.youtube.com/embed/S_8SND_Kk8c",
          name: "Sports Network"
        },
        music: {
          url: "https://www.youtube.com/embed/jfKfPfyJRdk",
          name: "Lofi Beats - Chill Station"
        },
        gaming: {
          url: "https://www.youtube.com/embed/O8YV7mX0XyE", 
          name: "Riot Games eSports"
        },
        nature: {
          url: "https://www.youtube.com/embed/i_H1mN2YIn4",
          name: "Deep Wilderness Cam"
        }
      };

      // Update Player
      player.src = channels[channel].url + "?autoplay=1";
      title.innerText = channels[channel].name;

      // Update UI Active State
      const buttons = document.querySelectorAll('.channel-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
